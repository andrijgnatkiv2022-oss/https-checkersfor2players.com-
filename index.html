<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шашки з магазином та обертанням</title>
    <style>
        :root {
            --bg-dark: #0d0e15;
            --panel-bg: rgba(24, 26, 38, 0.95);
            --accent: #6c5ce7;
            --accent-hover: #5849c4;
            --gold: #fdcb6e;
            --board-border: #2d3436;
            --light-square: #dfe6e9;
            --dark-square: #2d3436;
            --highlight: rgba(0, 184, 148, 0.85);
            --selected: rgba(253, 203, 110, 0.95);
            --text-main: #f5f6fa;
            
            /* Стилі фішок за замовчуванням (Класичні) */
            --piece-1-bg: radial-gradient(circle at 30% 30%, #ffffff, #dcdde1);
            --piece-1-border: #bdc3c7;
            --piece-2-bg: radial-gradient(circle at 30% 30%, #485460, #1e272c);
            --piece-2-border: #111;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .screen.hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--gold);
            text-shadow: 0 4px 10px rgba(253, 203, 110, 0.3);
        }

        .menu-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px 0;
            width: 80%;
            max-width: 300px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.4);
        }

        .menu-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .menu-btn.secondary {
            background-color: #2f3640;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        .menu-btn.secondary:hover {
            background-color: #353b48;
        }

        /* МАГАЗИН */
        .shop-container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }

        .shop-item {
            background: var(--panel-bg);
            border: 2px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-item.active {
            border-color: var(--gold);
        }

        .shop-info h3 {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .shop-info p {
            font-size: 0.9rem;
            color: var(--gold);
        }

        .shop-action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .shop-action-btn:hover {
            background-color: var(--accent-hover);
        }

        .shop-action-btn.owned {
            background-color: #27ae60;
        }

        /* ІГРОВИЙ ЕКРАН */
        #gameScreen {
            max-width: 800px;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 480px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .coins-display {
            color: var(--gold);
        }

        .board-container {
            position: relative;
            padding: 10px;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid var(--board-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .light {
            background-color: var(--light-square);
        }

        .dark {
            background-color: var(--dark-square);
        }

        .square.highlight::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: var(--highlight);
            border-radius: 50%;
        }

        .square.selected {
            background-color: var(--selected) !important;
        }

        .piece {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 3px 6px rgba(255,255,255,0.4), 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .piece:hover {
            transform: scale(1.05);
        }

        .piece.player1 {
            background: var(--piece-1-bg);
            border: 2px solid var(--piece-1-border);
        }

        .piece.player2 {
            background: var(--piece-2-bg);
            border: 2px solid var(--piece-2-border);
        }

        .piece.king::after {
            content: '👑';
            font-size: 20px;
        }

        /* МОДАЛЬНЕ ВІКНО */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.hidden {
            display: none !important;
        }

        .modal-content {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid var(--gold);
            box-shadow: 0 10px 30px rgba(253, 203, 110, 0.2);
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .modal-content p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- ЕКРАН МЕНЮ -->
    <div id="menuScreen" class="screen">
        <h1>ШАШКИ</h1>
        <button class="menu-btn" onclick="startGame()">Грати проти друга</button>
        <button class="menu-btn secondary" onclick="openShop()">Магазин скінів</button>
        <div style="margin-top: 20px; font-size: 1.1rem;">Монети: <span id="menuCoins" style="color: var(--gold);">100</span> 🪙</div>
    </div>

    <!-- ЕКРАН МАГАЗИНУ -->
    <div id="shopScreen" class="screen hidden">
        <h1>МАГАЗИН</h1>
        <div class="shop-container" id="shopList">
            <!-- Генерується через JavaScript -->
        </div>
        <div style="margin-bottom: 15px; font-size: 1.1rem;">Баланс: <span id="shopCoins" style="color: var(--gold);">100</span> 🪙</div>
        <button class="menu-btn secondary" onclick="closeShop()">Назад у меню</button>
    </div>

    <!-- ІГРОВИЙ ЕКРАН -->
    <div id="gameScreen" class="screen hidden">
        <div class="game-header">
            <span id="turnInfo">Хід білих</span>
            <span class="coins-display">🪙 <span id="gameCoins">100</span></span>
        </div>
        
        <div class="board-container" id="boardContainer">
            <div class="board" id="board"></div>
        </div>

        <button class="menu-btn secondary" style="margin-top: 20px; background: #e74c3c;" onclick="returnToMenu()">Здатися / Меню</button>
    </div>

    <!-- ВІКНО ПЕРЕМОГИ -->
    <div id="winModal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2>Перемога!</h2>
            <p id="winText">Чудова партія!</p>
            <p style="color: var(--gold); margin-bottom: 20px;">Нагорода за матч: +50 🪙</p>
            <button class="menu-btn" onclick="returnToMenu()">В головне меню</button>
        </div>
    </div>

    <script>
        let coins = parseInt(localStorage.getItem('checkers_coins')) || 100;
        let ownedSkins = JSON.parse(localStorage.getItem('checkers_owned')) || ['classic'];
        let currentSkin = localStorage.getItem('checkers_skin') || 'classic';

        const skinsData = {
            classic: { name: 'Класичні', cost: 0, p1Bg: 'radial-gradient(circle at 30% 30%, #ffffff, #dcdde1)', p1Border: '#bdc3c7', p2Bg: 'radial-gradient(circle at 30% 30%, #485460, #1e272c)', p2Border: '#111' },
            neon: { name: 'Неон Кібер', cost: 150, p1Bg: 'radial-gradient(circle at 30% 30%, #00cec9, #0984e3)', p1Border: '#00ffe7', p2Bg: 'radial-gradient(circle at 30% 30%, #e84393, #d63031)', p2Border: '#ff007f' },
            gold: { name: 'Золотий Королівський', cost: 300, p1Bg: 'radial-gradient(circle at 30% 30%, #ffeaa7, #fdcb6e)', p1Border: '#e1b12c', p2Bg: 'radial-gradient(circle at 30% 30%, #2d3436, #000000)', p2Border: '#fdcb6e' }
        };

        let boardState = [];
        let turn = 'white';
        let selectedPiece = null;
        let validMoves = [];

        function updateCoinsDisplay() {
            document.getElementById('menuCoins').innerText = coins;
            document.getElementById('shopCoins').innerText = coins;
            document.getElementById('gameCoins').innerText = coins;
            localStorage.setItem('checkers_coins', coins);
            localStorage.setItem('checkers_owned', JSON.stringify(ownedSkins));
            localStorage.setItem('checkers_skin', currentSkin);
            applySkinStyles();
        }

        function applySkinStyles() {
            const skin = skinsData[currentSkin];
            const root = document.documentElement;
            root.style.setProperty('--piece-1-bg', skin.p1Bg);
            root.style.setProperty('--piece-1-border', skin.p1Border);
            root.style.setProperty('--piece-2-bg', skin.p2Bg);
            root.style.setProperty('--piece-2-border', skin.p2Border);
        }

        function openShop() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('shopScreen').classList.remove('hidden');
            renderShop();
        }

        function closeShop() {
            document.getElementById('shopScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            updateCoinsDisplay();
        }

        function renderShop() {
            const shopList = document.getElementById('shopList');
            shopList.innerHTML = '';

            for (let key in skinsData) {
                const skin = skinsData[key];
                const isOwned = ownedSkins.includes(key);
                const isActive = currentSkin === key;

                const item = document.createElement('div');
                item.className = `shop-item ${isActive ? 'active' : ''}`;
                
                item.innerHTML = `
                    <div class="shop-info">
                        <h3>${skin.name}</h3>
                        <p>${isOwned ? (isActive ? 'Використовується' : 'Куплено') : skin.cost + ' 🪙'}</p>
                    </div>
                    <button class="shop-action-btn ${isOwned ? 'owned' : ''}" onclick="handleSkinAction('${key}')">
                        ${isActive ? 'Обрано' : (isOwned ? 'Обрати' : 'Купити')}
                    </button>
                `;
                shopList.appendChild(item);
            }
        }

        function handleSkinAction(key) {
            const skin = skinsData[key];
            if (ownedSkins.includes(key)) {
                currentSkin = key;
            } else {
                if (coins >= skin.cost) {
                    coins -= skin.cost;
                    ownedSkins.push(key);
                    currentSkin = key;
                } else {
                    alert('Недостатньо монет!');
                }
            }
            updateCoinsDisplay();
            renderShop();
        }

        function startGame() {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            initBoard();
            renderBoard();
            updateCoinsDisplay();
        }

        function returnToMenu() {
            document.getElementById('winModal').classList.add('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('menuScreen').classList.remove('hidden');
            updateCoinsDisplay();
        }

        function initBoard() {
            boardState = Array(8).fill(null).map(() => Array(8).fill(null));
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        boardState[r][c] = { player: 'black', king: false };
                    }
                }
            }
            for (let r = 5; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if ((r + c) % 2 === 1) {
                        boardState[r][c] = { player: 'white', king: false };
                    }
                }
            }
        }

        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const square = document.createElement('div');
                    square.classList.add('square');
                    square.classList.add((r + c) % 2 === 0 ? 'light' : 'dark');
                    square.dataset.row = r;
                    square.dataset.col = c;

                    if (validMoves.some(m => m.r === r && m.c === c)) {
                        square.classList.add('highlight');
                    }
                    if (selectedPiece && selectedPiece.r === r && selectedPiece.c === c) {
                        square.classList.add('selected');
                    }

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.classList.add('piece', piece.player === 'white' ? 'player1' : 'player2');
                        if (piece.king) pieceEl.classList.add('king');
                        square.appendChild(pieceEl);
                    }

                    square.addEventListener('click', () => handleSquareClick(r, c));
                    boardEl.appendChild(square);
                }
            }
        }

        function handleSquareClick(r, c) {
            const piece = boardState[r][c];
            const move = validMoves.find(m => m.r === r && m.c === c);
            
            if (move) {
                executeMove(selectedPiece.r, selectedPiece.c, r, c, move.jumpR, move.jumpC);
                return;
            }

            if (piece && piece.player === turn) {
                selectedPiece = { r, c };
                validMoves = getValidMoves(r, c);
                renderBoard();
            } else {
                selectedPiece = null;
                validMoves = [];
                renderBoard();
            }
        }

        function getValidMoves(r, c) {
            const piece = boardState[r][c];
            if (!piece) return [];
            let moves = [];
            let directions = [];

            if (piece.player === 'white' || piece.king) directions.push(-1);
            if (piece.player === 'black' || piece.king) directions.push(1);

            directions.forEach(dr => {
                [-1, 1].forEach(dc => {
                    let nr = r + dr;
                    let nc = c + dc;
                    if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                        if (!boardState[nr][nc]) {
                            moves.push({ r: nr, c: nc });
                        } else if (boardState[nr][nc].player !== piece.player) {
                            let nnr = nr + dr;
                            let nnc = nc + dc;
                            if (nnr >= 0 && nnr < 8 && nnc >= 0 && nnc < 8 && !boardState[nnr][nnc]) {
                                moves.push({ r: nnr, c: nnc, jumpR: nr, jumpC: nc });
                            }
                        }
                    }
                });
            });
            return moves;
        }

        function executeMove(fromR, fromC, toR, toC, jumpR, jumpC) {
            boardState[toR][toC] = boardState[fromR][fromC];
            boardState[fromR][fromC] = null;

            if (jumpR !== undefined && jumpC !== undefined) {
                boardState[jumpR][jumpC] = null;
            }

            if (boardState[toR][toC].player === 'white' && toR === 0) boardState[toR][toC].king = true;
            if (boardState[toR][toC].player === 'black' && toR === 7) boardState[toR][toC].king = true;

            selectedPiece = null;
            validMoves = [];

            turn = turn === 'white' ? 'black' : 'white';
            document.getElementById('turnInfo').innerText = turn === 'white' ? 'Хід білих' : 'Хід чорних';
            
            const container = document.getElementById('boardContainer');
            container.style.transform = turn === 'black' ? 'rotate(180deg)' : 'rotate(0deg)';
            
            document.querySelectorAll('.piece').forEach(p => {
                p.style.transform = turn === 'black' ? 'rotate(180deg)' : 'rotate(0deg)';
            });

            checkWinCondition();
            renderBoard();
        }

        function checkWinCondition() {
            let whiteCount = 0;
            let blackCount = 0;

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    if (boardState[r][c]?.player === 'white') whiteCount++;
                    if (boardState[r][c]?.player === 'black') blackCount++;
                }
            }

            if (whiteCount === 0 || blackCount === 0) {
                const winner = whiteCount === 0 ? 'Чорні' : 'Білі';
                document.getElementById('winText').innerText = `Перемогли ${winner}!`;
                document.getElementById('winModal').classList.remove('hidden');
                coins += 50;
                updateCoinsDisplay();
            }
        }

        updateCoinsDisplay();
    </script>
</body>
</html>
